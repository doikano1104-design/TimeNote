<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TimeNote | 勤怠管理</title><meta name="theme-color" content="#4d66df"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="TimeNote"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><style>body{margin:0;background:#f4f6fa;color:#243047;font-family:system-ui,'Noto Sans JP',sans-serif}main{max-width:1000px;margin:35px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:28px}.sub{color:#758096}.panel{background:white;border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 5px 24px #172b4d0b}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:13px 19px;cursor:pointer;background:#e9edf5;color:#243047;font-weight:700}button.primary{background:#4d66df;color:white}button.stop{background:#243047;color:white}button:disabled{opacity:.4;cursor:not-allowed}.clock{font-size:42px;font-weight:750;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#f5f7fc;border-radius:12px;padding:18px}.stat b{display:block;font-size:24px;margin-top:7px}label{display:inline-flex;align-items:center;gap:8px;margin:8px 15px 8px 0}input{border:1px solid #d7deea;border-radius:8px;padding:9px;font:inherit;max-width:145px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:13px 9px;border-bottom:1px solid #e9edf4;text-align:left}th{color:#738098} .scroll{overflow-x:auto}.muted{color:#758096;font-size:13px}.status{font-weight:700;color:#4d66df}@media(max-width:600px){.stats{grid-template-columns:1fr}.clock{font-size:34px}}select{border:1px solid #d7deea;border-radius:8px;padding:9px;background:white;font:inherit}@media(max-width:600px){main{margin:18px auto;padding:0 12px}.panel{padding:18px;margin:14px 0}header{align-items:flex-start;gap:12px}h1{font-size:24px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.actions button{min-height:48px;padding:12px 8px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stat{padding:11px 7px;font-size:11px}.stat b{font-size:15px;overflow-wrap:anywhere}.clock{font-size:38px}h2{font-size:19px}input{max-width:115px}table{min-width:560px}} </style></head><body><main><header><div><h1>TimeNote <span style="font-size:14px;color:#7785a2">勤怠管理</span></h1><div class="sub">無料で使えるシンプルな勤怠記録</div></div><span class="status" id="status">未出勤</span></header><section class="panel"><div class="muted">現在時刻</div><div class="clock" id="clock"></div><div class="actions"><button class="primary" id="in">出勤</button><button id="break">休憩開始</button><button id="resume">休憩終了</button><button class="stop" id="out">退勤</button></div><p class="muted" id="notice">この端末のブラウザ内に保存されます。</p></section><section class="panel"><h2>今月の集計</h2><div class="stats"><div class="stat">勤務日数<b id="days">0日</b></div><div class="stat">実働時間<b id="hours">0時間</b></div><div class="stat">概算給与<b id="pay">¥0</b></div></div><div><label>時給 <input id="wage" type="number" min="0" value="1200"></label><label>通貨 <select id="currency"><option value="JPY">JPY (円)</option><option value="KRW">KRW (ウォン)</option></select></label></div><div class="muted">概算給与＝実働時間×時給。残業割増・税・保険料は未反映です。</div></section><section class="panel"><h2>勤務履歴</h2><div class="actions"><button id="csv">CSV出力</button><button id="clear">全記録を削除</button></div><div class="scroll"><table><thead><tr><th>日付</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th><th>操作</th></tr></thead><tbody id="history"></tbody></table></div></section><p class="muted">試作版：1人用・端末内保存。ログイン、複数従業員、クラウド同期には未対応です。</p></main><script>
const key='timenote_records_v1',configKey='timenote_config_v1';let records=JSON.parse(localStorage.getItem(key)||'[]'),config=JSON.parse(localStorage.getItem(configKey)||'{"wage":1200,"currency":"JPY"}');const $=id=>document.getElementById(id);$('wage').value=config.wage;$('currency').value=config.currency;const fmt=t=>t?new Date(t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'—';const date=t=>new Date(t).toLocaleDateString('sv-SE');const active=()=>records.findLast(r=>!r.out);const save=()=>{localStorage.setItem(key,JSON.stringify(records));render()};const minutes=r=>{let end=r.out||Date.now(),br=(r.breaks||[]).reduce((s,b)=>s+((b.end||end)-b.start),0);return Math.max(0,(end-r.in-br)/60000)};const duration=m=>`${Math.floor(m/60)}時間${Math.floor(m%60)}分`;function render(){let a=active(),onBreak=a&&a.breaks?.length&&!a.breaks.at(-1).end;$('status').textContent=!a?'未出勤':onBreak?'休憩中':'勤務中';$('in').disabled=!!a;$('break').disabled=!a||!!onBreak;$('resume').disabled=!onBreak;$('out').disabled=!a;let month=new Date().toLocaleDateString('sv-SE').slice(0,7),current=records.filter(r=>date(r.in).startsWith(month)),total=current.reduce((s,r)=>s+minutes(r),0);$('days').textContent=new Set(current.map(r=>date(r.in))).size+'日';$('hours').textContent=duration(total);$('pay').textContent=new Intl.NumberFormat('ja-JP',{style:'currency',currency:config.currency,maximumFractionDigits:0}).format(total/60*config.wage);$('history').innerHTML=records.length?records.slice().reverse().map(r=>`<tr><td>${date(r.in)}</td><td>${fmt(r.in)}</td><td>${fmt(r.out)}</td><td>${duration((r.breaks||[]).reduce((s,b)=>s+((b.end||r.out||Date.now())-b.start)/60000,0))}</td><td>${duration(minutes(r))}</td><td><button data-del="${r.id}">削除</button></td></tr>`).join(''):'<tr><td colspan="6">まだ記録がありません</td></tr>'}
$('in').onclick=()=>{records.push({id:crypto.randomUUID(),in:Date.now(),out:null,breaks:[]});save()};$('break').onclick=()=>{let a=active();if(a){a.breaks.push({start:Date.now(),end:null});save()}};$('resume').onclick=()=>{let a=active();if(a){let b=a.breaks.at(-1);if(b&&!b.end)b.end=Date.now();save()}};$('out').onclick=()=>{let a=active();if(a){let b=a.breaks.at(-1);if(b&&!b.end)b.end=Date.now();a.out=Date.now();save()}};$('history').onclick=e=>{let id=e.target.dataset.del;if(id&&confirm('この勤務記録を削除しますか？')){records=records.filter(r=>r.id!==id);save()}};$('clear').onclick=()=>{if(confirm('すべての勤務記録を削除しますか？元に戻せません。')){records=[];save()}};function settings(){config={wage:Number($('wage').value)||0,currency:$('currency').value};localStorage.setItem(configKey,JSON.stringify(config));render()}$('wage').oninput=settings;$('currency').onchange=settings;$('csv').onclick=()=>{let rows=[['日付','出勤','退勤','休憩(分)','実働(分)'],...records.map(r=>[date(r.in),fmt(r.in),fmt(r.out),Math.round((r.breaks||[]).reduce((s,b)=>s+((b.end||r.out||Date.now())-b.start)/60000,0)),Math.round(minutes(r))])];let csv='\ufeff'+rows.map(row=>row.join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='attendance.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('ja-JP');if(active())render()},1000);$('clock').textContent=new Date().toLocaleTimeString('ja-JP');render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}</script></body></html>
